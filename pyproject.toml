[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-selection-xblock"
dynamic = ["version"]
description = "Group Selection XBlock for Open edX"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "OpenCraft"}]
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "XBlock>=1.5.0,<3.0",
    "pydantic>=2.12.5,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
    "pytest-mock",
]

[project.entry-points]
"xblock.v1" = {group_selection = "group_selection_xblock.group_selection:GroupSelectionXBlock"}

[project.urls]
Homepage = "https://github.com/open-craft/group-selection-xblock"

[tool.setuptools]
packages = {find = {include = ["group_selection_xblock", "group_selection_xblock.*"], exclude = ["*tests*"]}}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "group_selection_xblock.__version__"}

[tool.setuptools.package-data]
group_selection_xblock = ["static/**", "templates/**"]

[tool.pytest.ini_options]
testpaths = ["group_selection_xblock/tests"]
